name: Hardware POS checks

on:
  push:
    branches:
      - codex/shop-opening-pilot
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Frontend and server production build
        run: npm run build

name: Hardware POS checks

on:
  workflow_dispatch:
  # Pull requests validate the proposed merge; use workflow_dispatch for branches without a PR.
  pull_request:
    branches:
      - main

concurrency:
  group: hardware-pos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-pilot-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Windows scripts and real PostgreSQL billing
        shell: powershell
        run: ./scripts/verify-windows-ci.ps1
  mint-script-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python3 -m compileall -q scripts/mint
      - name: Check shell syntax
        run: |
          set -euo pipefail
          for file in scripts/mint/*.sh; do bash -n "$file"; done
      - name: Check JavaScript syntax
        run: |
          for file in scripts/mint/*.mjs; do node --check "$file" || exit 1; done
      - name: Release fingerprint regression tests
        run: |
          python3 scripts/mint/test-release-fingerprint.py
          python3 scripts/mint/test-open.py
          python3 scripts/mint/test-desktop-window.py
          python3 scripts/mint/test-maintenance-center.py
          python3 scripts/mint/test-prepare-repair.py
          python3 scripts/mint/test-repair-backup-review.py
          python3 scripts/mint/test-repair-readiness.py
          python3 scripts/mint/test-repair-build-retention.py
          python3 scripts/mint/test-repair-native-probe.py
          python3 scripts/mint/test-native-repair-rehearsal.py
          python3 scripts/mint/test-repair-rollback-preparation.py
          python3 scripts/mint/test-repair-interruption.py
          python3 scripts/mint/test-repair-activation-plan.py
          python3 scripts/mint/test-repair-switch-rehearsal.py
          python3 scripts/mint/test-uninstall-preview.py
          python3 scripts/mint/test-uninstall-backup-review.py
          python3 scripts/mint/test-uninstall-backup-preparation.py
          python3 scripts/mint/test-uninstall-restore.py
          python3 scripts/mint/test-installation-identity.py
          python3 scripts/mint/test-desktop-registration.py
          python3 scripts/mint/test-uninstall-shutdown.py
          python3 scripts/mint/test-uninstall-cancellation.py
          python3 scripts/mint/test-setup-ui.py
          python3 scripts/mint/test-setup-destination.py
          python3 scripts/mint/test-switch-journal.py
          python3 scripts/mint/test-switch-coordinator.py
          python3 scripts/mint/test-interrupted-switch.py
  maintenance-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardware_pos_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hardware_pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source snapshot against a restored PostgreSQL dump
        run: python3 scripts/mint/test-backup-snapshot.py ${{ job.services.postgres.id }}
      - name: PostgreSQL maintenance lock contention (isolated database)
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
        run: node --test tests/postgres-maintenance-lock.integration.mjs
  application-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardware_pos_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hardware_pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security audit (production and development)
        run: |
          set -euo pipefail
          mkdir -p security-audit
          # Collect both reports even when npm detects vulnerabilities.
          for scope in production all; do
            args=()
            if [ "$scope" = production ]; then args+=(--omit=dev); fi
            code=0
            npm audit "${args[@]}" --json > "security-audit/$scope.json" || code=$?
            node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.error || !r.metadata?.vulnerabilities || !r.vulnerabilities) process.exit(1); console.log(JSON.stringify(r.metadata.vulnerabilities)); for(const [name,v] of Object.entries(r.vulnerabilities)) console.log(name, v.severity, v.isDirect ? "direct" : "transitive", v.range, JSON.stringify(v.fixAvailable));' "security-audit/$scope.json"
            if [ "$code" -gt 1 ]; then exit "$code"; fi
          done
      - name: Retain dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: security-audit/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce zero reported dependency vulnerabilities
        if: always()
        run: |
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            for (const scope of ["production", "all"]) {
              const r = JSON.parse(fs.readFileSync("security-audit/" + scope + ".json", "utf8"));
              if (r.error || r.metadata?.vulnerabilities?.total !== 0) {
                throw new Error("Dependency security gate failed: " + scope);
              }
            }'
      - name: TypeScript checks
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Verify generated A4 mixed-unit invoice
        run: |
          if ! command -v pdftotext >/dev/null; then
            # PDF validation only requires Ubuntu's signed repositories.
            # Do not depend on unrelated third-party runner repositories.
            sources=/etc/apt/sources.list.d/ubuntu.sources
            test -f "$sources"
            sudo apt-get -o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
            sudo apt-get -o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts=- install -y poppler-utils
          fi
          command -v pdftotext >/dev/null
          node --import tsx --test tests/ars-shared-stock-pdf.integration.mjs
      - name: Verify multipage PDF and workbook branding
        run: |
          set -euo pipefail
          output="$(mktemp -d)"
          trap 'rm -rf "$output"' EXIT
          node --import tsx scripts/generate-report-compatibility-fixtures.ts "$output"
          python3 scripts/verify-report-branding.py "$output"
      - name: Verify official quotation branding and saved mixed units
        run: node --import tsx --test tests/quotation-branding.integration.mjs
      - name: Frontend and server production build
        run: npm run build
  database-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardware_pos_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hardware_pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repair writer exclusion and interrupted coordinator rehearsal
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
        run: node --test tests/postgres-repair-exclusion.integration.mjs
      - name: Double-entry accounting safeguards (isolated PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
        run: node --import tsx --test tests/postgres-general-ledger.integration.mjs
      - name: Real PostgreSQL checkout integration
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
          JWT_SECRET: ci-secret-not-for-production-long-random-placeholder
        run: node --import tsx --test --test-concurrency=1 tests/postgres-checkout.integration.mjs tests/postgres-purchases.integration.mjs tests/postgres-credit.integration.mjs tests/postgres-product-intake.integration.mjs
      - name: Shared-stock packaging lifecycle (isolated PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
          JWT_SECRET: ci-secret-not-for-production-long-random-placeholder
        run: node --import tsx --test tests/postgres-shared-stock.integration.mjs
      - name: Customer profile edit and financial preservation (isolated PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
          JWT_SECRET: ci-secret-not-for-production-long-random-placeholder
        run: node --import tsx --test tests/postgres-customer-profile.integration.mjs
      - name: ARS full purchasing-to-customer-account lifecycle (isolated PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
          JWT_SECRET: ci-secret-not-for-production-long-random-placeholder
        run: node --import tsx --test tests/postgres-ars-full-lifecycle.integration.mjs
      - name: ARS full quotation-to-invoice operational acceptance (isolated PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
          JWT_SECRET: ci-secret-not-for-production-long-random-placeholder
        run: node --import tsx --test tests/postgres-ars-operational-acceptance.integration.mjs
      - name: Fresh database first-administrator setup integration
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
        run: node --import tsx --test tests/postgres-first-admin.integration.mjs
      - name: Real authenticated PostgreSQL login and session integration
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
        run: node --import tsx --test tests/postgres-auth-session.integration.mjs
      - name: Verify ARS three-partner profit allocations in isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
        run: node --import tsx --test tests/postgres-ars-profit.integration.mjs
      - name: ARS financial lifecycle and populated backup fixtures (isolated PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
          JWT_SECRET: ci-secret-not-for-production-long-random-placeholder
        run: node --import tsx --test tests/postgres-ars-financial.integration.mjs
      - name: Restore isolated PostgreSQL backup and verify accounting records
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/hardware_pos_ci
        run: bash scripts/verify-postgres-backup-ci.sh
      - name: Run installed Mint backup and isolated recovery rehearsal
        run: bash scripts/verify-mint-rehearsal-ci.sh ${{ job.services.postgres.id }}
  hosted-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardware_pos_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hardware_pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build isolated hosted container image (no deployment)
        run: docker build --tag ars-hardware-pos:ci .
      - name: Smoke test hosted container and persistent uploads (isolated PostgreSQL)
        run: bash scripts/verify-hosted-container-ci.sh
  validate:
    if: ${{ always() }}
    needs: [maintenance-validation, application-validation, database-validation, hosted-validation, windows-pilot-checks, mint-script-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success,success,success"

  package-pilot:
    # Acceptance package only; this job neither deploys nor publishes a release.
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Linux x64 runtime payload
        run: |
          set -euo pipefail
          runtime="$(dirname "$(dirname "$(realpath "$(command -v node)")")")"
          test -f "$runtime/LICENSE"
          test -x "$runtime/bin/npm"
          tar -C "$runtime" -czf "$RUNNER_TEMP/ars-node-linux-x64.tar.gz" bin lib LICENSE
      - name: Install signed Ubuntu SVG renderer
        run: sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Create pilot source archive with optional Mint runtime
        env:
          PILOT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p pilot-package
          python3 scripts/generate-desktop-icon.py public/ars-official.svg pilot-package/ars-desktop.ico
          python3 scripts/package-shop-pilot.py "$PILOT_COMMIT" pilot-package "$RUNNER_TEMP/ars-node-linux-x64.tar.gz"
      - name: Retain installation package and SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: ars-distributor-v1-pilot
          path: pilot-package/
          retention-days: 14

  package-windows-exe:
    needs: [package-pilot]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ars-distributor-v1-pilot
          path: pilot-package
      - name: Compile native Windows acceptance bootstrapper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem pilot-package -Filter '*.zip'
          if (@($zip).Count -ne 1) { throw 'Expected one validated package.' }
          $expected=(Get-Content -LiteralPath ($zip.FullName+'.sha256') -Raw).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $zip.FullName).Hash -ine $expected) { throw 'Package checksum mismatch.' }
          New-Item -ItemType Directory -Path native-package | Out-Null
          $exe=Join-Path (Resolve-Path native-package).Path 'ARS-Distributor-Setup.exe'
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $icon=Join-Path (Resolve-Path native-package).Path 'ars-desktop.ico'
          $archive=[IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entry=$archive.GetEntry('ARS-Distributor/public/ars-desktop.ico')
            if (-not $entry) { throw 'Missing official desktop icon.' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,$icon)
          } finally { $archive.Dispose() }
          & $csc /nologo /target:winexe /optimize+ "/win32icon:$icon" "/out:$exe" "/resource:$($zip.FullName),ARS.Payload.zip" /reference:System.Windows.Forms.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll (Resolve-Path -LiteralPath "scripts/windows-native-setup.cs").Path
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed.' }
          $process=Start-Process -FilePath $exe -ArgumentList '--verify-payload' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Embedded payload verification failed.' }
          Remove-Item -LiteralPath $icon
          ((Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()+'  ARS-Distributor-Setup.exe') | Set-Content -Encoding ascii -LiteralPath ($exe+'.sha256')
      - uses: actions/upload-artifact@v4
        with:
          name: ars-distributor-windows-native-pilot
          path: native-package/
          retention-days: 14

  package-mint-deb:
    needs: [package-pilot]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ars-distributor-v1-pilot
          path: pilot-package
      - name: Build and inspect Linux Mint native bootstrap package
        run: python3 scripts/package-mint-deb.py pilot-package native-package
      - uses: actions/upload-artifact@v4
        with:
          name: ars-distributor-mint-native-pilot
          path: native-package/
          retention-days: 14

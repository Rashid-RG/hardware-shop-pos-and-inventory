name: Improvement request
description: Propose a scoped improvement to the wholesale system.
title: "[Improvement]: "
body:
  - type: markdown
    attributes:
      value: New scope is subject to release priorities. Do not include business records or secrets.
  - type: textarea
    id: problem
    attributes:
      label: Business problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe the observable result and any data preservation requirements.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Impact
      options:
        - Blocks shop opening
        - Important operational improvement
        - Future enhancement
    validations:
      required: true

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hardware_pos_ars
      POSTGRES_USER: ars
      POSTGRES_PASSWORD: ${ARS_MINT_DB_PASSWORD:?Missing Mint database password}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ars -d hardware_pos_ars"]
      interval: 2s
      timeout: 3s
      retries: 45
volumes:
  data:

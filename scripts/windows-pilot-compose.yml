services:
  postgres:
    image: postgres:16-alpine
    container_name: ars-windows-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hardware_pos_ars
      POSTGRES_USER: ars
      POSTGRES_PASSWORD: ${ARS_WINDOWS_DB_PASSWORD:?private database password required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ars -d hardware_pos_ars"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  pilot_pgdata:

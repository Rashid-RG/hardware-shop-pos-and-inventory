services:
  postgres:
    image: postgres:16-alpine
    container_name: hardware-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hardware_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - hardware_pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardware_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hardware_pos_pgdata:
